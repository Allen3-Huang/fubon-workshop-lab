[project]
name = "asus-ai-coding-agent-workshop"
version = "0.1.0"
description = "Python + FastAPI workshop repository for the Agentic Software Development Workflow labs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "ruff==0.11.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q -m 'not lab1'"
markers = [
  "lab1: acceptance tests for Lab 1; run with pytest -q -m lab1",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
